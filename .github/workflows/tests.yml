name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,dicom]' 'lightning>=2.4,<3'
      - run: pytest -q
      - run: ruff check src/mammoscreen --exclude 'src/mammoscreen/_models/**'
      - run: ruff check training/data_preparation/corrected training/mammoscreen_recipe.py training/mammoscreen_logging.py
      - run: python -m build
      - run: python -m build --wheel training
